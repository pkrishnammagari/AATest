# SonarQube project configuration.
#
# The exclusions matter more than they look:
#   - assets/fonts/fonts_inline.css is ~1MB of base64-embedded woff2 (a
#     deliberate air-gap measure -- see .gitignore and assets/fonts/OFL.txt).
#     Its multi-hundred-KB lines drown or crash CSS analysis and carry no
#     analysable code.
#   - docs/BRD.docx is an unscannable binary.
#   - ReferenceJSON/ holds anonymized fixture payloads -- data, not code.
sonar.projectKey=fh-aecb-analyzer-v2
sonar.projectName=FH AECB Analyzer V2
sonar.sources=aecb,scripts,app.py
sonar.exclusions=assets/fonts/fonts_inline.css,docs/**,ReferenceJSON/**,assets/fonts/**
sonar.python.version=3.9
sonar.sourceEncoding=UTF-8
