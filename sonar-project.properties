# SonarQube project configuration for FH AECB Analyzer.
#
# Scope:
#   sources  -- everything that is deployed: the aecb package, the production
#               entry point app_api.py, and the deployment scripts. app.py is
#               the development harness (not deployed) but shares the aecb
#               package, so it is scanned as well.
#   tests    -- tests/ (pytest). Coverage comes from coverage.xml, produced by
#                 python -m pytest --cov --cov-report=xml
#
# Not scanned:
#   scripts/ -- developer QA tooling (layout measurement in headless Chrome,
#               the corpus harness, fixture generation, font fetching). It is
#               never deployed; .gitattributes export-ignores it from the
#               release archive. To scan it anyway, add it to sonar.sources.
#   assets/fonts/fonts_inline.css -- ~1 MB of base64-embedded webfonts (the
#               air-gapped server cannot fetch fonts); no analysable code.
#   ReferenceJSON/ -- anonymized and synthetic fixture payloads (data).
#   docs/    -- documentation, including a binary .docx.

sonar.projectKey=fh-aecb-analyzer-v2
sonar.projectName=FH AECB Analyzer
sonar.sourceEncoding=UTF-8

sonar.sources=aecb,app_api.py,app.py,deploy
sonar.tests=tests
sonar.exclusions=assets/**,ReferenceJSON/**,docs/**,scripts/**

sonar.python.version=3.9
sonar.python.coverage.reportPaths=coverage.xml
