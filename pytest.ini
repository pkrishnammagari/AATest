[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    browser: needs a local Chrome/Chromium (skipped when none is found)
    model: needs the local Ollama model service (skipped when unavailable)
    live_api: calls the real bureau-report API; needs credentials and AECB_TEST_SUBJECT_ID (skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
